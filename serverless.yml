service: serverless-image-processing

frameworkVersion: '3.40.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    UPLOAD_BUCKET: ${self:custom.uploadBucket}
    PROCESSED_BUCKET: ${self:custom.processedBucket}
    SQS_QUEUE_URL:
      Ref: ImageProcessingQueue
    DLQ_URL:
      Ref: ImageProcessingDLQ
    DYNAMODB_TABLE: ${self:custom.dynamoTable}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource:
        - arn:aws:s3:::${self:custom.uploadBucket}/*
        - arn:aws:s3:::${self:custom.processedBucket}/*
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - Fn::GetAtt: [ImageProcessingQueue, Arn]
        - Fn::GetAtt: [ImageProcessingDLQ, Arn]
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
      Resource:
        - Fn::GetAtt: [ImageMetadataTable, Arn]

custom:
  uploadBucket: image-uploads-${sls:stage}
  processedBucket: image-processed-${sls:stage}
  dynamoTable: image-metadata-${sls:stage}
  s3:
    host: localhost
    directory: /tmp
  serverless-offline:
    httpPort: 3000

functions:
  triggerHandler:
    handler: src/handlers/trigger.handler
    events:
      - s3:
          bucket: ${self:custom.uploadBucket}
          event: s3:ObjectCreated:*
          rules:
            - suffix: .jpg
      - s3:
          bucket: ${self:custom.uploadBucket}
          event: s3:ObjectCreated:*
          rules:
            - suffix: .png

  processingHandler:
    handler: src/handlers/process.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ImageProcessingQueue, Arn]
          batchSize: 1
    onError:
      Fn::GetAtt: [ImageProcessingDLQ, Arn]

resources:
  Resources:
    ImageProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: image-processing-queue-${sls:stage}
        VisibilityTimeout: 60
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ImageProcessingDLQ, Arn]
          maxReceiveCount: 3

    ImageProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: image-processing-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    ImageMetadataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.dynamoTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: imageId
            AttributeType: S
        KeySchema:
          - AttributeName: imageId
            KeyType: HASH

plugins:
  - serverless-offline
  - serverless-s3-local
  - serverless-offline-sqs
