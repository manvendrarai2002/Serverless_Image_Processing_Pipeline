name: Serverless Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'serverless.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    paths:
      - 'serverless.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/infra-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Validate infrastructure
        run: npm test
